name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/802361569175/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: firebase-deployer@multiplyr-app.iam.gserviceaccount.com
          create_credentials_file: true
          token_format: access_token

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project multiplyr-app
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
