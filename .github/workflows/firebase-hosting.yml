name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/802361569175/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: firebase-deployer@multiplyr-app.iam.gserviceaccount.com
          token_format: access_token

      - name: Deploy to Firebase Hosting
        run: |
          set +e
          npx firebase-tools@latest deploy --only hosting --project multiplyr-app 2>&1 | tee deploy-output.txt
          EXIT=$?
          grep -q "current active version" deploy-output.txt && EXIT=0
          exit $EXIT
        env:
          FIREBASE_TOKEN: ${{ steps.auth.outputs.access_token }}
